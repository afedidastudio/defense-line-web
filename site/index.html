		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		
/* Defense Line loading screen: existing game art, real progress, no artificial wait. */
#status { background:#15291f; isolation:isolate; font-family:"Segoe UI",Arial,sans-serif; }
#status-splash { display:block!important; height:100%!important; width:100%!important; max-width:none; max-height:none; object-fit:cover!important; opacity:.55; filter:brightness(.65); z-index:-2; image-rendering:auto!important; }
#status::after { content:""; position:absolute; inset:0; background:linear-gradient(0deg,rgba(10,23,16,.96),rgba(10,23,16,.1) 70%); z-index:-1; }
#web-brand { text-align:center; color:#f1d798; text-shadow:0 3px 5px #132117; margin-top:17vh; }
#web-brand h1 { font-size:clamp(38px,7vw,74px); margin:0; line-height:1.2; }
#web-brand p { letter-spacing:.18em; font-size:18px; margin:12px 0 0; }
#web-progress-label { position:absolute; bottom:18%; font-size:17px; color:#f1e6c8; text-align:center; width:95%; }
#status-progress { display:block; bottom:12%; width:min(70%,540px); height:17px; appearance:none; border:2px solid #b79a56; border-radius:4px; background:#182c20; overflow:hidden; }
#status-progress::-webkit-progress-bar { background:#182c20; }
#status-progress::-webkit-progress-value { background:linear-gradient(90deg,#7b9562,#d7bb70); }
#status-progress::-moz-progress-bar { background:#bfa965; }
#status-notice { max-width:750px; margin-top:35px; background:#573c30; border-color:#c29b59; }

</style>

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {

		lines.forEach((line) => {

 const progressText=document.getElementById('web-progress-label');
 if(progressText) progressText.textContent=total>0 ? 'טוען את המשחק · Loading '+Math.min(100,Math.floor(current/total*100))+'%' : 'טוען את המשחק · '+(current/1048576).toFixed(1)+' MB';
				if (current > 0 && total > 0) {

					statusProgress.max = total;
