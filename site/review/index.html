<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קו ההגנה · מפות המערכה</title><link rel="icon" href="../index.icon.png">
<style>*{box-sizing:border-box}body{margin:0;background:#20251f;color:#f2e6c3;font:17px/1.5 Arial,sans-serif}header{padding:24px;background:#342f25;border-bottom:4px solid #999077}h1{margin:0}a{color:#edd09c}nav{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}button,select,input{font:inherit;padding:10px;min-height:44px;border:2px solid #a59b7c;background:#3a4033;color:#f5eacc;border-radius:5px}main{padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(256px,1fr));gap:20px}article{border:3px solid #8d8e7a;background:#352f25;padding:8px;border-radius:7px}article button{padding:0;border:0;background:none;width:100%}article img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}h2{font-size:18px;margin:7px 0}small{color:#c8c6ad}dialog{width:min(96vw,1320px);background:#272c23;border:4px solid #b7a47c;color:#fff0cc;padding:12px}dialog::backdrop{background:#000b}dialog img{width:100%;display:block}dialog button{margin-bottom:10px;float:left}</style>
<header><h1>מפות המערכה · Campaign battlefields</h1><p>100 שלבים ושלב בונוס · לחצו על מפה לתצוגה מלאה</p><a href="../">למשחק · Play</a><nav><select aria-label="גזרה" id="sector"><option value="all">כל הגזרות · All sectors</option></select><input id="search" type="search" placeholder="מספר או שם שלב · Search" aria-label="חיפוש שלב"></nav><span id="count"></span></header><main></main><dialog><button autofocus>סגירה · Close</button><h2></h2><div id="variants"></div><img alt="מפת שלב"></dialog>
<script>const box=document.querySelector('main'),dialog=document.querySelector('dialog'),filter=document.getElementById('sector'),search=document.getElementById('search');let stages=[];function draw(){box.replaceChildren();let list=stages.filter(s=>(filter.value==='all'||s.chapter===Number(filter.value))&&(s.number+' '+s.he+' '+s.en).toLowerCase().includes(search.value.toLowerCase()));document.getElementById('count').textContent=list.length+' מפות · maps';for(const s of list){let card=document.createElement('article'),button=document.createElement('button'),img=document.createElement('img'),title=document.createElement('h2'),small=document.createElement('small'),id=String(s.number).padStart(3,'0');img.src='maps/thumb-'+id+'.jpg';img.loading='lazy';img.alt=s.he;button.append(img);button.setAttribute('aria-label',s.number+' '+s.he);button.onclick=()=>{dialog.querySelector('h2').textContent=s.number+' · '+s.he+' / '+s.en;dialog.querySelector('img').src='maps/stage-'+id+'.jpg';const variants=dialog.querySelector('#variants');variants.replaceChildren();for(const [j,file] of ['stage-'+id+'.jpg',...s.events].entries()){let v=document.createElement('button');v.textContent=j?'אירוע '+j+' · Event '+j:'פתיחת שלב · Initial';v.onclick=()=>dialog.querySelector('img').src='maps/'+file;variants.append(v)}dialog.showModal()};title.textContent=s.number+' · '+s.he;small.textContent=s.en+' · '+s.sector;card.append(button,title,small);box.append(card)}}filter.onchange=search.oninput=draw;dialog.querySelector('button').onclick=()=>dialog.close();fetch('stages.json').then(r=>r.json()).then(data=>{stages=data;for(const chapter of [...new Set(stages.map(s=>s.chapter))]){let o=document.createElement('option');o.value=chapter;o.textContent=stages.find(s=>s.chapter===chapter).sector;filter.append(o)}draw()});</script></html>
